name: Weekly image rebuild

# The runtime base image is unpinned so it picks up security fixes. This
# rebuilds the latest release every week, with a fresh base image and no
# build cache, and republishes it under the same version tags, so the
# published image gets those fixes even when Granary's code hasn't changed.

on:
  schedule:
    # Mondays, an hour after CI's weekly dependency check.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Find the latest release
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No release tags yet, so there is nothing to rebuild."
          else
            echo "Rebuilding $tag"
            git checkout --quiet "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.tag != ''
        uses: docker/setup-buildx-action@v3
      - if: steps.release.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/granary
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
      # Build and scan first, so an image with a fixable high or critical
      # vulnerability is never published.
      - if: steps.release.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: granary:scan
      - if: steps.release.outputs.tag != ''
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: granary:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: steps.release.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
