<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Granary</title>
  <link rel="icon" href="/ui/icon.svg?v={{VERSION}}" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/app.css?v={{VERSION}}">
  <script src="/ui/app.js?v={{VERSION}}" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/">
        <img src="/ui/icon.svg?v={{VERSION}}" alt="">
        Granary
      </a>

      <form class="search-form" id="search-form" role="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/>
        </svg>
        <label for="global-search" class="sr-only">Search packages</label>
        <input id="global-search" type="search" placeholder="Search packages" autocomplete="off">
      </form>

      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/repos" data-nav="repos">Repositories</a>
        <a href="#/browse" data-nav="browse">Browse</a>
        <span class="group-gap" aria-hidden="true"></span>
        <a href="#/cleanup" data-nav="cleanup">Cleanup</a>
        <a href="#/tasks" data-nav="tasks">Tasks</a>
        <a href="#/system" data-nav="system">System</a>
        <a href="#/logs" data-nav="logs">Logs</a>
      </nav>

      <div class="side-foot">
        <div class="access" id="access"></div>
        <div>Granary {{VERSION}}</div>
      </div>
    </aside>

    <main id="content" tabindex="-1">
      <div class="page" id="view"><p class="loading">Loading…</p></div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="row">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" id="confirm-ok" class="danger"></button>
      </div>
    </form>
  </dialog>

  <dialog id="token-dialog">
    <form method="dialog" id="token-form">
      <h2>Admin token</h2>
      <p>Deleting packages, cleanup and running tasks need the token set in <code>GRANARY_ADMIN_TOKEN</code>. It is kept in this browser only.</p>
      <label for="token-input" class="sr-only">Admin token</label>
      <input id="token-input" type="password" autocomplete="current-password" placeholder="Paste the admin token">
      <p class="err hidden" id="token-err">That token was not accepted.</p>
      <div class="row">
        <button type="button" id="token-cancel">Cancel</button>
        <button value="ok" class="primary" id="token-save">Unlock</button>
      </div>
    </form>
  </dialog>
</body>
</html>
