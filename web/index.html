<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Granary</title>
  <link rel="icon" href="/ui/granary-icon.svg?v={{VERSION}}" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/app.css?v={{VERSION}}">
  <script src="/ui/app.js?v={{VERSION}}" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="auth hidden" id="auth"></div>
  <div class="shell hidden">
    <aside class="side">
      <a class="brand" href="#/">
        <img src="/ui/granary-logo.svg?v={{VERSION}}" alt="" width="40" height="40">
        Granary
      </a>

      <form class="search-form" id="search-form" role="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/>
        </svg>
        <label for="global-search" class="sr-only">Search packages</label>
        <input id="global-search" type="search" placeholder="Search packages" autocomplete="off">
      </form>

      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/repos" data-nav="repos">Repositories</a>
        <a href="#/browse" data-nav="browse">Browse</a>
        <a href="#/get" data-nav="get" class="admin-only">Get packages</a>
        <a href="#/templates" data-nav="templates">Templates</a>
        <span class="group-gap" aria-hidden="true"></span>
        <a href="#/cleanup" data-nav="cleanup">Cleanup</a>
        <a href="#/tasks" data-nav="tasks">Tasks</a>
        <a href="#/system" data-nav="system">System</a>
        <a href="#/logs" data-nav="logs" class="admin-only">Logs</a>
        <a href="#/audit" data-nav="audit" class="admin-only">Audit log</a>
        <span class="group-gap" aria-hidden="true"></span>
        <a href="#/tokens" data-nav="tokens">Access tokens</a>
        <a href="#/users" data-nav="users" class="admin-only">Users</a>
      </nav>

      <div class="side-foot">
        <div class="userbox" id="userbox"></div>
        <div>Granary {{VERSION}}</div>
      </div>
    </aside>

    <main id="content" tabindex="-1">
      <div class="page" id="view"><p class="loading">Loading…</p></div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="row">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" id="confirm-ok" class="danger"></button>
      </div>
    </form>
  </dialog>

</body>
</html>
