[package]
name = "granary"
version = "0.5.0"
edition = "2024"
description = "A small, self-hostable caching proxy for Cargo, npm, PyPI and Maven"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["registry", "proxy", "cache", "mirror", "artifact"]
categories = ["web-programming::http-server", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
axum-login = "0.18.0"
base64 = "0.22"
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.3"
hex = "0.4.3"
libc = "0.2.190"
password-auth = "1.0.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2", "gzip", "brotli"] }
roxmltree = "0.21.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.8"
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret", "otpauth"] }
tower-sessions = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
