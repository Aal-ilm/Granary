[package]
name = "granary"
version = "0.1.0"
edition = "2024"
description = "A small, self-hostable caching proxy for Cargo, npm and PyPI"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["registry", "proxy", "cache", "mirror", "artifact"]
categories = ["web-programming::http-server", "development-tools"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
libc = "0.2.190"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
