services:
  granary:
    build: .
    image: granary:latest
    container_name: granary
    restart: unless-stopped
    ports:
      # No host port given: Docker picks a free one when the container starts.
      # Find it with: docker compose port granary 8080
      # To pin a port instead, write it as "HOSTPORT:8080", e.g. "8081:8080".
      - "8080"
    volumes:
      - granary-data:/data
    environment:
      # Set this when Granary sits behind a reverse proxy or is reached by a
      # name other than the one clients put in their config.
      # GRANARY_PUBLIC_URL: "https://granary.example.lan"
      # The first admin's password is generated and printed to this
      # container's log on first start. To choose it instead, put
      # GRANARY_ADMIN_PASSWORD=... in a .env file next to this one.
      GRANARY_ADMIN_PASSWORD: "${GRANARY_ADMIN_PASSWORD:-}"
      # "required": package downloads need an access token. "off": open.
      GRANARY_CLIENT_AUTH: "required"
      GRANARY_META_TTL_SECS: "300"
      RUST_LOG: "granary=info"

volumes:
  granary-data:
