services:
  granary:
    build: .
    image: granary:latest
    container_name: granary
    restart: unless-stopped
    ports:
      # No host port given: Docker picks a free one when the container starts.
      # Find it with: docker compose port granary 8080
      # To pin a port instead, write it as "HOSTPORT:8080", e.g. "8081:8080".
      - "8080"
    volumes:
      - granary-data:/data
      # A self-hosted Gitea as a private upstream (see the README's Gitea
      # section): a file holding its access token, and your own CA if
      # Gitea's certificate comes from one. Both read-only.
      # - ./secrets/gitea-token:/run/secrets/gitea-token:ro
      # - ./certs/internal-ca.pem:/etc/granary/internal-ca.pem:ro
    environment:
      # Set this when Granary sits behind a reverse proxy or is reached by a
      # name other than the one clients put in their config.
      # GRANARY_PUBLIC_URL: "https://granary.example.lan"
      # Behind a reverse proxy, also list its address (or network) so
      # Granary sees real client addresses for sign-in limits and the
      # audit log. Docker's bridge networks are inside 172.16.0.0/12.
      # GRANARY_TRUSTED_PROXIES: "172.16.0.0/12"
      # The first admin's password is generated on first start and written
      # to /data/initial-admin-password (read it with
      #   docker compose exec granary cat /data/initial-admin-password
      # ); it is never logged. To choose it instead, put
      # GRANARY_ADMIN_PASSWORD=... in a .env file next to this one.
      GRANARY_ADMIN_PASSWORD: "${GRANARY_ADMIN_PASSWORD:-}"
      # "required": package downloads need an access token. "off": open.
      GRANARY_CLIENT_AUTH: "required"
      GRANARY_META_TTL_SECS: "300"
      RUST_LOG: "granary=info"
      # Gitea, with the files mounted above. Who may read what comes from
      # it is chosen on the System page, or fixed here with
      # GRANARY_PRIVATE_ACCESS ("scoped" or "signed-in").
      # GRANARY_GITEA_URL: "https://gitea.example.lan"
      # GRANARY_GITEA_TOKEN_FILE: "/run/secrets/gitea-token"
      # GRANARY_EXTRA_CA: "/etc/granary/internal-ca.pem"
      # Granary refuses upstreams at private addresses. List internal
      # mirrors you set as upstreams here (the Gitea host is always allowed).
      # GRANARY_PRIVATE_HOSTS: "nexus.example.lan"
      # Warming templates (filling the cache with every dependency) uses the
      # optional granary-warmer service below. Start it with
      #   docker compose --profile warmer up -d
      # after putting GRANARY_WARMER_SECRET=<16+ random characters> in .env.
      # Without it, everything else works and the web UI hides warming.
      GRANARY_WARMER_URL: "http://granary-warmer:9090"
      GRANARY_WARMER_SECRET: "${GRANARY_WARMER_SECRET:-}"
      GRANARY_WARMER_GRANARY_URL: "http://granary:8080"
    # Granary only writes to /data, so the rest of the container can be
    # read-only and it needs no Linux capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [default, warm]

  granary-warmer:
    profiles: [warmer]
    # Published next to Granary's image with the same version tags. Keep the
    # two on the same version. To build it yourself instead, replace this
    # line with "build: ./warmer".
    image: ghcr.io/aal-ilm/granary-warmer:0.8
    container_name: granary-warmer
    restart: unless-stopped
    environment:
      WARMER_SECRET: "${GRANARY_WARMER_SECRET:-}"
      # Only Granary may send it jobs.
      WARMER_ALLOW_FROM: "granary"
    # Job directories are made here and deleted when each job ends.
    volumes:
      - granary-warmer-work:/work
    networks: [warm]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  # Only Granary and the warmer are on this network, and it has no route to
  # the internet, so the warmer can download only through Granary.
  warm:
    internal: true

volumes:
  granary-data:
  granary-warmer-work:
